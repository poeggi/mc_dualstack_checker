name: Live check

# Runs test/live.sh against the deployed web interface and API: after
# every frontend deploy (waiting for the VM to pick up the release first),
# daily, and on demand. Addresses come from the variables LIVE_URL and
# MC_BACKEND, the test servers from the secrets LIVE_BEDROCK_HOST and
# LIVE_JAVA_HOST; test/live.sh skips what is not set.

on:
  workflow_run:
    workflows: ["Deploy frontend"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: wait for the VM to run the released version
        if: ${{ github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v') && vars.MC_BACKEND != '' }}
        env:
          want: ${{ github.event.workflow_run.head_branch }}
          API: ${{ vars.MC_BACKEND }}
        run: |
          i=1
          while [ "$i" -le 60 ]; do
            got=$(curl -fsS "${API%/}/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "attempt $i: want $want, got $got"
            [ "$got" = "$want" ] && exit 0
            sleep 15
            i=$((i + 1))
          done
          exit 1

      - name: live checks
        env:
          WEB: ${{ vars.LIVE_URL }}
          API: ${{ vars.MC_BACKEND }}
          LIVE_BEDROCK_HOST: ${{ secrets.LIVE_BEDROCK_HOST }}
          LIVE_JAVA_HOST: ${{ secrets.LIVE_JAVA_HOST }}
          EXPECT_VERSION: ${{ github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_branch || '' }}
        run: sh test/live.sh
