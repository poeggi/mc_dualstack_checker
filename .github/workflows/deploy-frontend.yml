name: Deploy frontend

# Uploads frontend/ to the web host via FTPS on every published release.
# lftp, not curl or basic-ftp: the host resets the data socket for those.
# Required GitHub secrets: FTP_HOST, FTP_USER, FTP_PASS
# Optional GitHub variables: FTP_TARGET_DIR (default ./, for an FTP user
# jailed at the target folder), MC_BACKEND (backend URL; empty = page says
# no backend is configured), LIVE_URL (page URL with a trailing slash,
# post-deploy check)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Connect and list only, upload nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: write the settings into the page and api.php
        # The values end up inside HTML attributes, PHP string literals and
        # sed replacements.
        env:
          MC_BACKEND: ${{ vars.MC_BACKEND }}
          VERSION: ${{ github.event.release.tag_name || format('manual-{0}', github.run_number) }}
        run: |
          for v in "$MC_BACKEND" "$VERSION"; do
            case "$v" in *[\'\"\\\&\|\<\>]*) echo "unexpected character in a config value" >&2; exit 1 ;; esac
          done
          API=${MC_BACKEND%/}
          sed -i -e "s|data-api=\"[^\"]*\"|data-api=\"$API\"|" \
                 -e "s|data-version=\"[^\"]*\"|data-version=\"$VERSION\"|" \
                 -e "s|id=\"version\">[^<]*<|id=\"version\">$VERSION<|" \
                 -e "s|?v=[^\"]*\"|?v=$VERSION\"|g" frontend/index.html
          sed -i -e "s|^define('MC_BACKEND', '[^']*');|define('MC_BACKEND', '$API');|" \
                 -e "s|^define('MC_VERSION', '[^']*');|define('MC_VERSION', '$VERSION');|" frontend/api.php
          grep -F "<body data-api=\"$API\" data-version=\"$VERSION\">" frontend/index.html
          grep -F "define('MC_BACKEND', '$API');" frontend/api.php
          grep -F "define('MC_VERSION', '$VERSION');" frontend/api.php
          # Every include stamp carries the release, or the upload stops.
          n=$(grep -o '?v=[^"]*"' frontend/index.html | wc -l)
          m=$(grep -o -F "?v=$VERSION\"" frontend/index.html | wc -l)
          [ "$n" -gt 0 ] && [ "$n" -eq "$m" ] || { echo "$m of $n stamps carry $VERSION" >&2; exit 1; }

      - name: install lftp
        # The runner image carries a Google Chrome apt source whose hash
        # mismatch breaks apt-get update; lftp only needs Ubuntu's archive.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: mirror frontend/ to the FTP root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
          TARGET: ${{ vars.FTP_TARGET_DIR }}
          DRY: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: |
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ssl:verify-certificate yes; set ftp:ssl-force true;
            set ftp:ssl-protect-data true; set net:timeout 20; set net:max-retries 2;
            set cmd:fail-exit on;
            mirror -R --delete --verbose --exclude-glob .health* $DRY frontend/ ${TARGET:-./};
            bye"

      - name: verify live
        if: ${{ !inputs.dry_run }}
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          VERSION: ${{ github.event.release.tag_name || format('manual-{0}', github.run_number) }}
        run: |
          test -n "$LIVE_URL" || { echo "LIVE_URL variable not set, skipping"; exit 0; }
          curl -fsS "$LIVE_URL" | grep -F "data-version=\"$VERSION\""
