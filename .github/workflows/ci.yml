name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest stable Go; go.mod keeps the oldest one the code needs.
      # The module has no dependencies, so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: vet, build and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
          go test ./...
      - name: backend checks
        run: sh test/backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node --check frontend/mc_dualstack_check.js
      - name: local includes carry a version stamp
        run: |
          ! grep -n -E '<(link|script|img)[^>]*(href|src)="[^"?:]+"' frontend/index.html deploy/www/*.html
      - run: php -l frontend/api.php
      - run: sh -n deploy/bootstrap.sh && sh -n deploy/mcdc-tick && sh -n test/backend.sh && sh -n test/live.sh
      - name: ascii only
        run: |
          ! git ls-files -z ':!*.png' | xargs -0 env LC_ALL=C grep -n '[^ -~	]'
