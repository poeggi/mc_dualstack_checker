name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: vet and build
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
      - name: backend checks
        run: sh test/backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check frontend/mc_dualstack_check.js
      - run: node --check frontend/providers.js
      - run: php -l frontend/api.php && php -l frontend/config.php
      - run: sh -n deploy/bootstrap.sh && sh -n deploy/mcdc-tick && sh -n test/backend.sh && sh -n test/live.sh
      - name: ascii only
        run: |
          ! LC_ALL=C grep -rn '[^ -~	]' frontend/*.js frontend/*.html frontend/*.css frontend/*.php backend/*.go deploy/ test/ README.md docs/
