name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest stable Go; go.mod keeps the oldest one the code needs.
      # The module has no dependencies, so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: vet, build and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
          go test ./...
      - name: backend checks
        run: sh test/backend.sh

  # The release path of the image against a local registry, with a
  # throwaway signing key: build, run, push signed, verify, move the major tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build, run, push signed, verify
        run: |
          docker run -d -p 127.0.0.1:5000:5000 docker.io/library/registry:3
          k=$RUNNER_TEMP/throwaway
          printf 'throwaway' > "$k.pass"
          skopeo generate-sigstore-key --output-prefix "$k" --passphrase-file "$k.pass"
          sh .github/stamp.sh v0.0.0
          SIGNING_KEY=$k.private SIGNING_PASSPHRASE=$k.pass PUBLIC_KEY=$k.pub TLS_VERIFY=false \
            sh .github/image.sh localhost:5000/mc_dualstack_check v0.0.0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node --check frontend/mc_dualstack_check.js
      - name: local includes carry a version stamp
        run: |
          ! grep -n -E '<(link|script|img)[^>]*(href|src)="[^"?:]+"' frontend/index.html backend/www/*.html
      - run: php -l frontend/api.php
      - run: sh -n test/backend.sh && sh -n test/live.sh && sh -n .github/stamp.sh && sh -n .github/image.sh
      - name: ascii only
        run: |
          ! git ls-files -z ':!*.png' | xargs -0 env LC_ALL=C grep -n '[^ -~	]'
