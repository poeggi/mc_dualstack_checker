name: Release backend

# Builds the backend for both VM architectures and attaches the binaries,
# the VM's deploy files (deploy.tar.gz) and their SHA256SUMS to the
# release. The VM pulls them itself (deploy/mcdc-tick), so no deploy
# credentials exist anywhere. SHA256SUMS goes up last: the VM acts on it.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: build
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must start with v and a digit" >&2; exit 1 ;; esac
          case "$TAG" in *[!A-Za-z0-9._+-]*) echo "unexpected character in tag" >&2; exit 1 ;; esac
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "../dist/mc_dualstack_check_linux_$arch" .
          done
          tar -czf ../dist/deploy.tar.gz -C ../deploy \
            Caddyfile mcdc-tick mc-dualstack-check.service mcdc-tick.service mcdc-tick.timer caddy.service www
          (cd ../dist && sha256sum mc_dualstack_check_linux_* deploy.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # One file at a time with retries: replacing an asset of a release
        # published again can fail while the old asset is still being removed.
        run: |
          upload() {
            for i in 1 2 3; do
              gh release upload "$TAG" "$1" --clobber && return 0
              sleep 10
            done
            return 1
          }
          for f in dist/mc_dualstack_check_linux_* dist/deploy.tar.gz; do upload "$f"; done
          upload dist/SHA256SUMS
