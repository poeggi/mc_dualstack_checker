name: Release backend

# Builds the backend for both VM architectures and attaches the binaries,
# the VM's deploy files (deploy.tar.gz, its pages stamped with the release)
# and their SHA256SUMS to the release. The VM pulls them itself (deploy/mcdc-tick), so no deploy
# credentials exist anywhere. SHA256SUMS goes up last: the VM acts on it.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest stable Go; go.mod keeps the oldest one the code needs.
      # The module has no dependencies, so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: build
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must start with v and a digit" >&2; exit 1 ;; esac
          case "$TAG" in *[!A-Za-z0-9._+-]*) echo "unexpected character in tag" >&2; exit 1 ;; esac
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "../dist/mc_dualstack_check_linux_$arch" .
          done
          # The pages carry the release: the version field and the ?v=
          # stamps of their includes. An unstamped include or a missed
          # stamp stops the release.
          if grep -n -E '<(link|script|img)[^>]*(href|src)="[^"?:]+"' ../deploy/www/*.html; then
            echo "local include without a version stamp" >&2; exit 1
          fi
          for f in ../deploy/www/*.html; do
            sed -e "s|id=\"api-version\">[^<]*<|id=\"api-version\">$TAG<|" \
                -e "s|?v=[^\"]*\"|?v=$TAG\"|g" "$f" > "$f.new"
            mv "$f.new" "$f"
          done
          n=$(awk '{ while (match($0, /[?]v=[^"]*"/)) { n++; $0 = substr($0, RSTART + RLENGTH) } } END { print n + 0 }' ../deploy/www/*.html)
          m=$(awk -v s="?v=$TAG\"" '{ while ((i = index($0, s)) > 0) { m++; $0 = substr($0, i + length(s)) } } END { print m + 0 }' ../deploy/www/*.html)
          [ "$n" -gt 0 ] && [ "$n" -eq "$m" ] || { echo "$m of $n stamps carry $TAG" >&2; exit 1; }
          grep -q -F "id=\"api-version\">$TAG<" ../deploy/www/index.html
          grep -q -F "id=\"api-version\">$TAG<" ../deploy/www/stats.html
          tar -czf ../dist/deploy.tar.gz -C ../deploy \
            Caddyfile mcdc-tick mc-dualstack-check.service mcdc-tick.service mcdc-tick.timer caddy.service www
          (cd ../dist && sha256sum mc_dualstack_check_linux_* deploy.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RID: ${{ github.event.release.id }}
        # A release published again under the same tag still holds its old
        # assets. They are removed by ID from the assets list, which is
        # current even when the release object lags behind.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" --jq '.[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          gh release upload "$TAG" dist/mc_dualstack_check_linux_* dist/deploy.tar.gz
          gh release upload "$TAG" dist/SHA256SUMS
