name: Release backend

# Publishes the backend image, its pages stamped with the release, signed,
# for both VM architectures (.github/image.sh). Hosts pull it themselves,
# so no deploy credentials exist anywhere. The binaries, the VM's deploy
# files (deploy.tar.gz) and their SHA256SUMS still go to the release for
# hosts that run mcdc-tick; SHA256SUMS goes up last: those hosts act on it.

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest stable Go; go.mod keeps the oldest one the code needs.
      # The module has no dependencies, so there is nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: stamp pages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: sh .github/stamp.sh "$TAG"

      - name: build
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "../dist/mc_dualstack_check_linux_$arch" .
          done
          tar -czf ../dist/deploy.tar.gz -C ../deploy \
            Caddyfile mcdc-tick mc-dualstack-check.service mcdc-tick.service mcdc-tick.timer caddy.service \
            -C ../backend www
          (cd ../dist && sha256sum mc_dualstack_check_linux_* deploy.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: image
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_PEM: ${{ secrets.IMAGE_SIGNING_KEY }}
          SIGNING_PASS: ${{ secrets.IMAGE_SIGNING_PASSPHRASE }}
        run: |
          [ -n "$SIGNING_KEY_PEM" ] && [ -n "$SIGNING_PASS" ] || { echo "signing secrets are not set" >&2; exit 1; }
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          umask 077
          printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/signing.key"
          printf '%s' "$SIGNING_PASS" > "$RUNNER_TEMP/signing.pass"
          SIGNING_KEY=$RUNNER_TEMP/signing.key SIGNING_PASSPHRASE=$RUNNER_TEMP/signing.pass \
            sh .github/image.sh "ghcr.io/$GITHUB_REPOSITORY" "$TAG"

      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RID: ${{ github.event.release.id }}
        # A release published again under the same tag still holds its old
        # assets. They are removed by ID from the assets list, which is
        # current even when the release object lags behind.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" --jq '.[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          gh release upload "$TAG" dist/mc_dualstack_check_linux_* dist/deploy.tar.gz
          gh release upload "$TAG" dist/SHA256SUMS
