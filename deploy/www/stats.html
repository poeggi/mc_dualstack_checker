<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mc_dualstack_check API usage</title>
    <meta name="description" content="Anonymous usage numbers of the Minecraft Server Dualstack Checker API.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="stats.js" defer></script>
</head>
<body><main>
    <header>
        <img src="favicon.svg" width="28" height="28" alt="">
        <h1>mc_dualstack_check API usage</h1>
    </header>
    <p>Unique clients per period (UTC). A client is an IPv4 address or an IPv6 /64; the numbers are estimates within about 2 %. Updated once a minute. The lighter bar is the running period.</p>
    <p class="legend"><span class="key v4"></span>IPv4 <span class="key v6"></span>IPv6</p>
    <div id="stats"><p>Loading...</p></div>
    <footer>
        <a href="./">API</a>. No addresses are stored, only counts.
    </footer>
</main></body>
</html>
