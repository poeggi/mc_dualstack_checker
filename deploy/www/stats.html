<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API usage statistics</title>
    <meta name="description" content="Anonymous usage numbers of the Minecraft Server Dualstack Checker API.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=dev">
    <link rel="stylesheet" href="style.css?v=dev">
    <script src="stats.js?v=dev" defer></script>
</head>
<body><main class="narrow">
    <header>
        <img src="favicon.svg?v=dev" width="28" height="28" alt="">
        <h1>API usage statistics</h1>
    </header>
    <p class="legend"><span class="switch"><button type="button" data-metric="requests" class="on">Requests</button><button type="button" data-metric="clients">Clients</button></span><span class="switch"><button type="button" data-view="family" class="on">Family</button><button type="button" data-view="cache">Cache</button></span><span data-view="family"><span class="key v4"></span>IPv4</span><span data-view="family"><span class="key v6"></span>IPv6</span><span data-view="cache" hidden><span class="key fresh"></span>Fresh</span><span data-view="cache" hidden><span class="key cached"></span>Cached</span><span data-view="cache" id="unrecorded" hidden><span class="key unrecorded"></span>Not recorded</span></p>
    <div id="stats"><p>Loading...</p></div>
    <footer>Times in UTC. API version <span id="api-version">dev</span>.</footer>
</main></body>
</html>
